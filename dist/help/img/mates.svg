<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5">
  <rect width="420" height="180" fill="#ffffff"/>
  <!-- concentric: pin in hole -->
  <g>
    <rect x="20" y="60" width="90" height="55" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="65" cy="87" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="65" cy="87" r="10" fill="#93c5fd" stroke="#2563eb"/>
    <text x="20" y="140" fill="#374151">концентричность</text>
    <text x="22" y="155" fill="#9ca3af" font-size="11">палец в отверстии</text>
  </g>
  <!-- revolute: hinge -->
  <g>
    <rect x="160" y="80" width="55" height="20" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="205" y="62" width="50" height="20" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" transform="rotate(-30 210 90)"/>
    <circle cx="210" cy="90" r="6" fill="#ef4444"/>
    <path d="M232,72 a22,22 0 0 1 8,18" fill="none" stroke="#6b7280" stroke-width="1.5"/>
    <polygon points="240,90 235,82 245,84" fill="#6b7280"/>
    <text x="165" y="140" fill="#374151">шарнир (revolute)</text>
    <text x="168" y="155" fill="#9ca3af" font-size="11">только вращение</text>
  </g>
  <!-- prismatic: slider -->
  <g>
    <rect x="300" y="95" width="100" height="14" rx="3" fill="#e5e7eb" stroke="#9ca3af"/>
    <rect x="320" y="80" width="36" height="22" rx="4" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
    <line x1="360" y1="91" x2="395" y2="91" stroke="#6b7280" stroke-width="1.5"/>
    <polygon points="395,91 387,86 387,96" fill="#6b7280"/>
    <text x="305" y="140" fill="#374151">ползун (prismatic)</text>
    <text x="308" y="155" fill="#9ca3af" font-size="11">только скольжение</text>
  </g>
</svg>
