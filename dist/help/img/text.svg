<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13">
  <rect width="360" height="160" fill="#ffffff"/>
  <!-- outline letters -->
  <text x="20" y="80" font-size="48" font-weight="800" fill="none" stroke="#2563eb" stroke-width="1.5">Аб</text>
  <text x="24" y="120" fill="#2563eb" font-size="12">контур букв (эскиз)</text>
  <!-- arrow -->
  <line x1="150" y1="60" x2="200" y2="60" stroke="#6b7280" stroke-width="2"/>
  <polygon points="200,60 190,55 190,65" fill="#6b7280"/>
  <text x="150" y="50" fill="#6b7280" font-size="11">выдавить</text>
  <!-- extruded letters (filled + shadow) -->
  <text x="222" y="82" font-size="48" font-weight="800" fill="#93c5fd" stroke="#2563eb" stroke-width="1">Аб</text>
  <text x="218" y="86" font-size="48" font-weight="800" fill="#2563eb" opacity="0.25">Аб</text>
  <text x="228" y="120" fill="#374151" font-size="12">объёмная надпись</text>
</svg>
