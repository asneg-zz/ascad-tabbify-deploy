<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13">
  <rect width="360" height="180" fill="#ffffff"/>
  <!-- block -->
  <polygon points="60,130 200,130 200,60 60,60" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <polygon points="60,60 200,60 240,32 100,32" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <polygon points="200,130 240,102 240,32 200,60" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
  <!-- hole (ellipse top + walls) -->
  <ellipse cx="150" cy="49" rx="20" ry="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <path d="M130,49 v40 a20,8 0 0 0 40,0 v-40" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <ellipse cx="150" cy="89" rx="20" ry="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <!-- tool arrow down -->
  <line x1="150" y1="18" x2="150" y2="40" stroke="#ef4444" stroke-width="2"/>
  <polygon points="150,42 145,33 155,33" fill="#ef4444"/>
  <text x="160" y="22" fill="#ef4444">вырез</text>
  <text x="250" y="120" fill="#374151">отверстие =</text>
  <text x="250" y="138" fill="#374151">круг → вырез</text>
</svg>
