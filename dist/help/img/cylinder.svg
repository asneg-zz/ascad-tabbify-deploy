<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13">
  <rect width="340" height="200" fill="#ffffff"/>
  <!-- cylinder body -->
  <path d="M70,50 a55,16 0 0 0 110,0 v100 a55,16 0 0 1 -110,0 z" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <ellipse cx="125" cy="50" rx="55" ry="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <!-- radius arrow (center → edge) on top -->
  <circle cx="125" cy="50" r="2.5" fill="#ef4444"/>
  <line x1="125" y1="50" x2="180" y2="50" stroke="#ef4444" stroke-width="2"/>
  <polygon points="180,50 171,46 171,54" fill="#ef4444"/>
  <text x="200" y="48" fill="#ef4444">радиус = 12</text>
  <text x="200" y="64" fill="#9ca3af" font-size="11">от центра до края</text>
  <!-- height arrow -->
  <line x1="55" y1="50" x2="55" y2="150" stroke="#16a34a" stroke-width="2"/>
  <polygon points="55,50 51,59 59,59" fill="#16a34a"/>
  <polygon points="55,150 51,141 59,141" fill="#16a34a"/>
  <text x="200" y="120" fill="#16a34a">высота = 40</text>
</svg>
