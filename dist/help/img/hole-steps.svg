<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5">
  <rect width="420" height="150" fill="#ffffff"/>
  <!-- 1: solid part -->
  <text x="20" y="30" fill="#374151">деталь</text>
  <rect x="20" y="45" width="90" height="60" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <!-- arrow -->
  <line x1="120" y1="75" x2="150" y2="75" stroke="#6b7280" stroke-width="2"/>
  <polygon points="150,75 141,71 141,79" fill="#6b7280"/>
  <!-- 2: draw circle -->
  <text x="165" y="30" fill="#374151">рисуем круг</text>
  <rect x="165" y="45" width="90" height="60" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="210" cy="75" r="18" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <!-- arrow -->
  <line x1="265" y1="75" x2="295" y2="75" stroke="#6b7280" stroke-width="2"/>
  <polygon points="295,75 286,71 286,79" fill="#6b7280"/>
  <text x="262" y="40" fill="#ef4444" font-size="11">вырез</text>
  <!-- 3: hole cut -->
  <text x="310" y="30" fill="#374151">вырезали</text>
  <rect x="310" y="45" width="90" height="60" rx="4" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="355" cy="75" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <ellipse cx="355" cy="75" rx="18" ry="18" fill="#eef2ff"/>
  <circle cx="355" cy="75" r="18" fill="none" stroke="#2563eb" stroke-width="2"/>
</svg>
