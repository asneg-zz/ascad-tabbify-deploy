<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="13">
  <rect width="320" height="170" fill="#ffffff"/>
  <!-- solid -->
  <polygon points="40,120 120,120 120,60 40,60" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <polygon points="40,60 120,60 150,40 70,40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <polygon points="120,120 150,100 150,40 120,60" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
  <text x="55" y="145" fill="#374151">сплошное</text>
  <!-- arrow -->
  <line x1="165" y1="85" x2="205" y2="85" stroke="#6b7280" stroke-width="2"/>
  <polygon points="205,85 195,80 195,90" fill="#6b7280"/>
  <text x="160" y="76" fill="#6b7280" font-size="11">оболочка</text>
  <!-- hollow (open top, walls) -->
  <polygon points="220,120 300,120 300,60 220,60" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <polygon points="220,60 300,60 330,40 250,40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <polygon points="300,120 330,100 330,40 300,60" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
  <!-- inner cavity -->
  <polygon points="232,58 292,58 312,44 252,44" fill="#ffffff" stroke="#93c5fd"/>
  <text x="240" y="145" fill="#374151">полое (стенки)</text>
</svg>
